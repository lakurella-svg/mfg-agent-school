apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: rca-investigator
  labels:
    app.kubernetes.io/part-of: agent-school
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: rca-investigator
  labels:
    app.kubernetes.io/part-of: agent-school
spec:
  source:
    type: Git
    git:
      # adjust to your fork; context is the repo root (image needs 101 data)
      uri: https://github.com/lakurella-svg/mfg-agent-school.git
      ref: main
    # The repo is private: the build clones with this secret. Create it once
    # with a GitHub token that has read access to the repo:
    #   oc create secret generic github-source -n agent-school     #     --type=kubernetes.io/basic-auth     #     --from-literal=username=<github-user> --from-literal=password=<token>
    #   oc annotate secret github-source -n agent-school     #     'build.openshift.io/source-secret-match-uri-1=https://github.com/*'
    sourceSecret:
      name: github-source
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: 201-rca-investigator/deploy/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: rca-investigator:latest
  triggers:
    - type: ConfigChange
# No git remote yet? Binary build from the repo root:
#   oc start-build rca-investigator --from-dir=. --follow
