# In-cluster image build: the plain-Kubernetes counterpart of the OpenShift
# BuildConfig (../ocp/base/imagestream-buildconfig.yaml). A Kaniko Job clones
# the repo and builds 201-rca-investigator/deploy/Containerfile from the REPO
# ROOT (the image bundles 101's dataset), then pushes to your registry.
#
# Prereqs: the github-source and registry-push secrets described in
# 101-moc-assistant/deploy/k8s/build-job.yaml. Set DESTINATION, then:
#   kubectl create -f build-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  generateName: rca-investigator-build-
  namespace: agent-school
  labels:
    app.kubernetes.io/name: rca-investigator-build
    app.kubernetes.io/part-of: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rca-investigator-build
    spec:
      restartPolicy: Never
      volumes:
        - name: docker-config
          secret:
            secretName: registry-push
            items:
              - key: .dockerconfigjson
                path: config.json
      containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:v1.23.2
          args:
            # adjust to your fork; context is the repo root
            - --context=git://github.com/lakurella-svg/mfg-agent-school.git#refs/heads/main
            - --dockerfile=201-rca-investigator/deploy/Containerfile
            - --destination=$(DESTINATION)
          env:
            - name: DESTINATION
              value: <registry>/agent-school/rca-investigator:latest
            - name: GIT_USERNAME
              valueFrom: {secretKeyRef: {name: github-source, key: username}}
            - name: GIT_PASSWORD
              valueFrom: {secretKeyRef: {name: github-source, key: password}}
          volumeMounts:
            - name: docker-config
              mountPath: /kaniko/.docker
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
