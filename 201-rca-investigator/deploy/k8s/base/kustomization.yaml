apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-school
# The agent-school Namespace comes from 101 (kubectl apply -k
# 101-moc-assistant/deploy/k8s/base); apply that first.
resources:
  - serviceaccount.yaml
  - rag-service.yaml
# Kubernetes has no ImageStream: point the image at your registry here.
# Default `rca-investigator:latest` works on a single-node cluster that
# shares the local image store (Docker Desktop, or kind after `kind load`).
images:
  - name: rca-investigator
    newName: rca-investigator
    newTag: latest
# ../job-rca.yaml and ../build-job.yaml use generateName; create them with
# `kubectl create -f`, not apply.
