# Pattern-2 skill backend: the retrieval index lives here, never in the
# agent pod. Scale this independently of agents. Same workload as
# ../../ocp/base/rag-service.yaml; image set in kustomization.yaml `images:`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-rag
  labels:
    app.kubernetes.io/name: rca-rag
    app.kubernetes.io/part-of: agent-school
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rca-rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rca-rag
    spec:
      # OpenShift injects a random UID; plain Kubernetes pins the UBI
      # image's non-root user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag
          image: rca-investigator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8201
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rca-rag
  labels:
    app.kubernetes.io/name: rca-rag
    app.kubernetes.io/part-of: agent-school
spec:
  selector:
    app.kubernetes.io/name: rca-rag
  ports:
    - name: http
      port: 8201
      targetPort: http
