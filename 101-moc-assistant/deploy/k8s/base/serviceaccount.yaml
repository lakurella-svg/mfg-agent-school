# Agent identity: each agent runs under its own ServiceAccount, never
# `default` (same rationale as ../../ocp/base/serviceaccount.yaml). The
# platform is plain Kubernetes, so platform identity is plain Kubernetes
# identity: RBAC, NetworkPolicies and audit all key off this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noc-assistant
  labels:
    app.kubernetes.io/name: noc-assistant
    app.kubernetes.io/part-of: agent-school
