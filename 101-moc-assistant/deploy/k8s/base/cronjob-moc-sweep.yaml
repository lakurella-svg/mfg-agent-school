# Continuous MOC sweep without a product harness: a CronJob runs the agent
# on a cadence. Ships suspended so applying it does not burn tokens;
# enable with: kubectl -n agent-school patch cronjob moc-sweep -p '{"spec":{"suspend":false}}'
# Same workload as ../../ocp/base/cronjob-moc-sweep.yaml; only the image
# reference differs (set it in kustomization.yaml `images:`).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: moc-sweep
  labels:
    app.kubernetes.io/name: moc-assistant
    app.kubernetes.io/part-of: agent-school
spec:
  schedule: "*/15 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: moc-assistant
        spec:
          restartPolicy: Never
          serviceAccountName: moc-assistant
          # OpenShift injects a random UID; plain Kubernetes uses the image's
          # user, so pin the UBI default non-root UID explicitly.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: agent
              image: moc-assistant:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: QUESTION
                  value: "Sweep the core: check alerts and anomalies; report only items needing MOC attention, else say ALL-CLEAR."
              envFrom:
                - secretRef:
                    name: llm-credentials
                - configMapRef:
                    name: mlflow-tracking
                    optional: true
                - configMapRef:
                    name: feature-store-client
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 512Mi }
