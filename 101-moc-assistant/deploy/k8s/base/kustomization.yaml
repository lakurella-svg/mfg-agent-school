apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agent-school
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - cronjob-moc-sweep.yaml
# Kubernetes has no ImageStream: point the image at your registry here.
# Default `moc-assistant:latest` works on a single-node cluster that shares
# the local image store (Docker Desktop, or kind after `kind load`).
images:
  - name: moc-assistant
    newName: moc-assistant
    newTag: latest
# ../job-ask.yaml and ../build-job.yaml use generateName; create them with
# `kubectl create -f`, not apply.
